<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="css/style.css">
  <title>His Majesty's Service - An Interactive Naval Novel</title>
</head>
<body>

  <div class="story-container">

    <!-- Sidebar with stats -->
    <div class="story-sidebar">

      <div class="naval-header">
        <h2>His Majesty's Service</h2>
        <p class="subtitle">Royal Navy, 1750</p>
      </div>

      <div class="stats-panel">
        <h3>Career</h3>
        <div class="stat-item">
          <span class="stat-label">Rank:</span>
          <span class="stat-value" id="rank">Midshipman</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Ship:</span>
          <span class="stat-value-small" id="ship">-</span>
        </div>
      </div>

      <div class="stats-panel">
        <h3>Skills</h3>
        <div class="stat-item">
          <span class="stat-label">Seamanship:</span>
          <span class="stat-value" id="seamanship">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Gunnery:</span>
          <span class="stat-value" id="gunnery">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Navigation:</span>
          <span class="stat-value" id="navigation">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Discipline:</span>
          <span class="stat-value" id="discipline">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Social:</span>
          <span class="stat-value" id="social">0</span>
        </div>
      </div>

      <div class="controls">
        <button class="side-button" id="save-btn">Save Progress</button>
        <button class="side-button" id="restart-btn">New Career</button>
      </div>

      <center><p class="credits"><small>An Interactive Novel</small></p></center>

    </div>

    <!-- Main story area -->
    <div class="story-main">

      <div class="story-header">
        <h1 id="chapter-title">His Majesty's Service</h1>
        <p id="chapter-subtitle">Your journey begins...</p>
      </div>

      <div class="story-content">

        <div id="story-text" class="story-text">
          <p>Loading story...</p>
        </div>

        <div id="story-choices" class="story-choices">
          <!-- Choices will be dynamically loaded here -->
        </div>

      </div>

    </div>

  </div>

  <script src="js/main.js"></script>
</body>
</html>
