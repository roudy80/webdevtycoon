<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
  <title>From Freelancer to Founder - An Interactive Story</title>
</head>
<body>

  <div class="story-container">

    <div class="story-sidebar">

      <div class="logo">
        <img src="img/logo.png">
      </div>

      <div class="stats-panel">
        <h2>Your Journey</h2>
        <div class="stat-item">
          <span class="stat-label">Money:</span>
          <span class="stat-value">&pound;<span id="money">0</span></span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Reputation:</span>
          <span class="stat-value"><span id="reputation">50</span>%</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Happiness:</span>
          <span class="stat-value"><span id="happiness">75</span>%</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Team Size:</span>
          <span class="stat-value"><span id="workerNum">0</span></span>
        </div>
      </div>

      <div class="achievements-panel">
        <h3>Achievements</h3>
        <div id="achievements-list"></div>
      </div>

      <div class="controls">
        <button class="side-button" onclick="saveStory()">Save Progress</button>
        <button class="side-button" onclick="restartStory()">New Story</button>
      </div>

      <center><p><small>Interactive Story Adaptation</small></p></center>

    </div><!--story-sidebar finish-->


    <div class="story-main">

      <div class="story-header">
        <h1 id="chapter-title">From Freelancer to Founder</h1>
        <p id="chapter-subtitle">Your journey begins...</p>
      </div>

      <div class="story-content">

        <div id="story-text" class="story-text">
          <!-- Story text will be dynamically loaded here -->
        </div>

        <div id="story-image" class="story-image">
          <!-- Story images will be dynamically loaded here -->
        </div>

        <div id="story-choices" class="story-choices">
          <!-- Choices will be dynamically loaded here -->
        </div>

      </div>

    </div>

  </div>

  <script src="http://code.jquery.com/jquery-1.11.2.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
